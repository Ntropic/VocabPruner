[project]
name = "vocabpruner"
version = "0.1.0"
description = "Shrink language models around the vocabulary your workload needs."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "gguf>=0.19",
    "numpy>=1.26",
    "regex>=2024.5.15",
    "rich>=13.7",
    "safetensors>=0.4.3",
    "torch",
    "tqdm>=4.66",
    "transformers>=4.41",
    "huggingface-hub>=0.23",
    "tokenizers>=0.19",
    "wordfreq>=3.1",
]

[project.optional-dependencies]
modelopt = [
    "nvidia-modelopt>=0.37",
]
compressed-tensors = [
    "compressed-tensors>=0.15",
]

[project.scripts]
vocabpruner = "vocabpruner.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--import-mode=importlib"]

[tool.hatch.build.targets.wheel]
packages = ["src/vocabpruner"]

[tool.hatch.build.targets.sdist]
include = ["/src/vocabpruner", "/tests", "/README.md", "/pyproject.toml", "/docs", "/mkdocs.yml"]
